name: nextgen-core

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  contract-and-e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm sbom --sbom-format cyclonedx > agentroom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: agentroom.cdx.json

  room-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Scripted model, legacy against durable: red on errors, repeated turns or failed recovery, or if durable adds over 250 ms per turn.
      - run: npm run -s bench:room -- --json --max-overhead-ms=250 > room-harness.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-harness
          path: room-harness.json
